services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: migrator
      POSTGRES_PASSWORD: migrator
      POSTGRES_DB: migrator
    ports:
      - "55433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U migrator"]
      interval: 2s
      retries: 30

  web:
    build: .
    profiles: ["app"]
    env_file: .env
    environment:
      DATABASE_URL: postgres://migrator:migrator@db:5432/migrator
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
