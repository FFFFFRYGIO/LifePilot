default_install_hook_types: [pre-commit, pre-push]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        exclude: ^assets/js/
      - id: end-of-file-fixer
        exclude: ^assets/js/
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
      - id: detect-private-key
      - id: mixed-line-ending
        args: [--fix=lf]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.8
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      # Run inside the uv environment so the django-stubs plugin sees the real dependencies.
      - id: mypy
        name: mypy
        entry: uv run python -m mypy .
        language: system
        types: [python]
        pass_filenames: false
      - id: django-migrations
        name: django makemigrations --check
        entry: uv run python manage.py makemigrations --check --dry-run --settings=config.test_settings
        language: system
        types: [python]
        pass_filenames: false
      # Needs Postgres: `docker compose up -d db`.
      - id: pytest
        name: pytest
        entry: uv run python -m pytest -q --no-cov
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
