<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>LifePilot — Hobbies</title>
  <link rel="stylesheet" href="../styles.css" />
</head>
<body class="page-category">
  <div class="phone">
    <header class="app-header app-header--back">
      <a class="header-back" href="../categories.html" aria-label="Back to categories">←</a>
      <div class="app-header__text">
        <h1>Hobbies</h1>
        <p>Personal development · 4 items</p>
      </div>
    </header>
    <main class="app-main">
      <a class="square-link square-link--accent category-add" href="../add-task.html">+ Add</a>
      <ul class="task-list task-list--scroll">
        <li class="task-item task-item--ok"><label class="task-check"><input type="checkbox" aria-label="Mark done" /><span class="task-check__ui" aria-hidden="true"></span></label>
          <div class="task-item__body">
            <div class="task-item__title">Read 20 pages</div>
            <div class="task-item__meta"><span class="task-item__due task-item__due--today">Today</span><span>Any time</span></div>
          </div>
        </li>
        <li class="task-item task-item--ok"><label class="task-check"><input type="checkbox" aria-label="Mark done" /><span class="task-check__ui" aria-hidden="true"></span></label>
          <div class="task-item__body">
            <div class="task-item__title">Guitar practice 15 min</div>
            <div class="task-item__meta"><span>Daily habit</span></div>
          </div>
        </li>
        <li class="task-item task-item--ok"><label class="task-check"><input type="checkbox" aria-label="Mark done" /><span class="task-check__ui" aria-hidden="true"></span></label>
          <div class="task-item__body">
            <div class="task-item__title">Edit weekend photos</div>
            <div class="task-item__meta"><span>When you have time</span></div>
          </div>
        </li>
        <li class="task-item task-item--ok"><label class="task-check"><input type="checkbox" aria-label="Mark done" /><span class="task-check__ui" aria-hidden="true"></span></label>
          <div class="task-item__body">
            <div class="task-item__title">Watch course lesson 4</div>
            <div class="task-item__meta"><span>Online course</span><span>25 min</span></div>
          </div>
        </li>
      </ul>
    </main>
        <nav class="bottom-nav" aria-label="Main navigation">
      <a href="../tasks.html"><span class="bottom-nav__icon" aria-hidden="true"></span>Tasks</a>
      <a class="is-active" href="../categories.html" aria-current="page"><span class="bottom-nav__icon" aria-hidden="true"></span>Categories</a>
      <a href="../calendar.html"><span class="bottom-nav__icon" aria-hidden="true"></span>Calendar</a>
    </nav>
  </div>
  <script src="../prototype.js"></script>
</body>
</html>
