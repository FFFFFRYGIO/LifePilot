<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>LifePilot — Chores</title>
  <link rel="stylesheet" href="../styles.css" />
</head>
<body class="page-category">
  <div class="phone">
    <header class="app-header app-header--back">
      <a class="header-back" href="../categories.html" aria-label="Back to categories">←</a>
      <div class="app-header__text">
        <h1>Chores</h1>
        <p>Home maintenance · 4 items</p>
      </div>
    </header>
    <main class="app-main">
      <a class="square-link square-link--accent category-add" href="../add-task.html">+ Add</a>
      <ul class="task-list">
        <li class="task-item task-item--alert"><label class="task-check"><input type="checkbox" aria-label="Mark done" /><span class="task-check__ui" aria-hidden="true"></span></label>
          <div class="task-item__body">
            <div class="task-item__title">Vacuum living room</div>
            <div class="task-item__meta"><span>Overdue</span><span>Was due Saturday</span></div>
          </div>
        </li>
        <li class="task-item task-item--warn"><label class="task-check"><input type="checkbox" aria-label="Mark done" /><span class="task-check__ui" aria-hidden="true"></span></label>
          <div class="task-item__body">
            <div class="task-item__title">Water balcony plants</div>
            <div class="task-item__meta"><span>Today</span><span>Evening</span></div>
          </div>
        </li>
        <li class="task-item task-item--ok"><label class="task-check"><input type="checkbox" aria-label="Mark done" /><span class="task-check__ui" aria-hidden="true"></span></label>
          <div class="task-item__body">
            <div class="task-item__title">Take out recycling</div>
            <div class="task-item__meta">Tomorrow morning</div>
          </div>
        </li>
        <li class="task-item task-item--ok"><label class="task-check"><input type="checkbox" aria-label="Mark done" /><span class="task-check__ui" aria-hidden="true"></span></label>
          <div class="task-item__body">
            <div class="task-item__title">Clean kitchen counters</div>
            <div class="task-item__meta">After dinner</div>
          </div>
        </li>
      </ul>
    </main>
        <nav class="bottom-nav" aria-label="Main navigation">
      <a href="../tasks.html"><span class="bottom-nav__icon" aria-hidden="true"></span>Tasks</a>
      <a class="is-active" href="../categories.html" aria-current="page"><span class="bottom-nav__icon" aria-hidden="true"></span>Categories</a>
      <a href="../calendar.html"><span class="bottom-nav__icon" aria-hidden="true"></span>Calendar</a>
    </nav>
  </div>
  <script src="../prototype.js"></script>
</body>
</html>
