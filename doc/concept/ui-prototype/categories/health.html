<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>LifePilot — Health</title>
  <link rel="stylesheet" href="../styles.css" />
</head>
<body class="page-category">
  <div class="phone">
    <header class="app-header app-header--back">
      <a class="header-back" href="../categories.html" aria-label="Back to categories">←</a>
      <div class="app-header__text">
        <h1>Health</h1>
        <p>Training and routines · 4 items</p>
      </div>
    </header>
    <main class="app-main">
      <a class="square-link square-link--accent category-add" href="../add-task.html">+ Add</a>
      <ul class="task-list">
        <li class="task-item task-item--warn task-item--done">
          <input type="checkbox" checked aria-label="Mark done" />
          <div class="task-item__body">
            <div class="task-item__title">Morning stretch</div>
            <div class="task-item__meta">Done 07:30</div>
          </div>
        </li>
        <li class="task-item task-item--warn">
          <input type="checkbox" aria-label="Mark done" />
          <div class="task-item__body">
            <div class="task-item__title">Evening run 5 km</div>
            <div class="task-item__meta">Skipped yesterday · Plan today</div>
          </div>
        </li>
        <li class="task-item task-item--ok">
          <input type="checkbox" aria-label="Mark done" />
          <div class="task-item__body">
            <div class="task-item__title">Take vitamins</div>
            <div class="task-item__meta">Daily · With breakfast</div>
          </div>
        </li>
        <li class="task-item task-item--ok">
          <input type="checkbox" aria-label="Mark done" />
          <div class="task-item__body">
            <div class="task-item__title">Drink 2 L water</div>
            <div class="task-item__meta">In progress · 1.2 L</div>
          </div>
        </li>
      </ul>
    </main>
        <nav class="bottom-nav" aria-label="Main navigation">
      <a href="../tasks.html"><span class="bottom-nav__icon" aria-hidden="true"></span>Tasks</a>
      <a class="is-active" href="../categories.html" aria-current="page"><span class="bottom-nav__icon" aria-hidden="true"></span>Categories</a>
      <a href="../calendar.html"><span class="bottom-nav__icon" aria-hidden="true"></span>Calendar</a>
    </nav>
  </div>
  <script src="../prototype.js"></script>
</body>
</html>
