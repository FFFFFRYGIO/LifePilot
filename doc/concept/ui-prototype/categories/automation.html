<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>LifePilot — Automation</title>
  <link rel="stylesheet" href="../styles.css" />
</head>
<body class="page-category">
  <div class="phone">
    <header class="app-header app-header--back">
      <a class="header-back" href="../categories.html" aria-label="Back to categories">←</a>
      <div class="app-header__text">
        <h1>Automation</h1>
        <p>Reminders and rules · 4 items</p>
      </div>
    </header>
    <main class="app-main">
      <a class="square-link square-link--accent category-add" href="../add-task.html">+ Add</a>
      <ul class="task-list">
        <li class="task-item task-item--warn">
          <input type="checkbox" aria-label="Mark done" />
          <div class="task-item__body">
            <div class="task-item__title">Weekly shopping list reminder</div>
            <div class="task-item__meta">Rule paused · Was Fri 18:00</div>
          </div>
        </li>
        <li class="task-item task-item--ok">
          <input type="checkbox" aria-label="Mark done" />
          <div class="task-item__body">
            <div class="task-item__title">Daily morning overview</div>
            <div class="task-item__meta">Active · 07:00</div>
          </div>
        </li>
        <li class="task-item task-item--ok">
          <input type="checkbox" aria-label="Mark done" />
          <div class="task-item__body">
            <div class="task-item__title">Low stock alert — pantry</div>
            <div class="task-item__meta">Active · When item low</div>
          </div>
        </li>
        <li class="task-item task-item--ok">
          <input type="checkbox" aria-label="Mark done" />
          <div class="task-item__body">
            <div class="task-item__title">Chore rotation assigner</div>
            <div class="task-item__meta">Active · Sundays</div>
          </div>
        </li>
      </ul>
    </main>
        <nav class="bottom-nav" aria-label="Main navigation">
      <a href="../tasks.html"><span class="bottom-nav__icon" aria-hidden="true"></span>Tasks</a>
      <a class="is-active" href="../categories.html" aria-current="page"><span class="bottom-nav__icon" aria-hidden="true"></span>Categories</a>
      <a href="../calendar.html"><span class="bottom-nav__icon" aria-hidden="true"></span>Calendar</a>
    </nav>
  </div>
  <script src="../prototype.js"></script>
</body>
</html>
